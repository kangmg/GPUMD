name: TorchNEP tests

# Run the CPU suite for package, qNEP documentation, qNEP comparison fixtures,
# and the numerical GPUMD implementation paths that the comparison covers.
# CUDA and external-GPUMD checks intentionally report skips here; release
# evidence still requires the documented local GPU/GPUMD command.
on:
  pull_request:
    paths:
      - 'torchnep/**'
      - 'tests_pytest/fixtures/models/qnep_mode2_*.txt'
      - 'tests_pytest/fixtures/structures/water-nat63-from-md.xyz'
      - 'tests_pytest/fixtures/structures/BaTiO3-nat40-rattled.xyz'
      - 'src/force/ewald.cu'
      - 'src/force/nep_charge.cu'
      - 'src/utilities/nep_utilities.cuh'
      - '.github/workflows/torchnep-test.yml'
  push:
    branches: [master]
    paths:
      - 'torchnep/**'
      - 'tests_pytest/fixtures/models/qnep_mode2_*.txt'
      - 'tests_pytest/fixtures/structures/water-nat63-from-md.xyz'
      - 'tests_pytest/fixtures/structures/BaTiO3-nat40-rattled.xyz'
      - 'src/force/ewald.cu'
      - 'src/force/nep_charge.cu'
      - 'src/utilities/nep_utilities.cuh'
      - '.github/workflows/torchnep-test.yml'

defaults:
  run:
    working-directory: torchnep

jobs:
  test:
    name: pytest (CPU, py3.10)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install CPU PyTorch + TorchNEP (with test extras)
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch wheel — keeps CI light and avoids CUDA downloads.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # torch is already satisfied above; this pulls numpy + ase + pytest.
          pip install -e '.[torch,ase,dev]'

      - name: Run tests (CPU)
        env:
          TEST_DEVICE: cpu
        run: pytest -q
